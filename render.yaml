services:
  - type: web
    name: liv8-command-center-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: liv8-command-center-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.16.0"
      - key: PORT
        value: "3005"
      - key: DB_DATA_DIR
        value: /var/data
      # Production Juno can reach the Mac Mini through an authenticated HTTPS tunnel.
      - key: MAC_AI_BRIDGE_URL
        sync: false
      - key: LIV8_MAC_BRIDGE_TOKEN
        sync: false
      - key: LOCAL_AI_FIRST
        value: "false"
      - key: ALLOW_PAID_AI_FALLBACK
        value: "false"
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_URL
        value: https://command.liv8.co
      - key: FRONTEND_URL
        value: https://command.liv8.co
      - key: TASKADE_API_KEY
        sync: false
      - key: TASKMAGIC_WEBHOOK_URL
        sync: false
      - key: TASKMAGIC_MCP_TOKEN
        sync: false
      - key: NIFTY_CLIENT_ID
        sync: false
      - key: NIFTY_CLIENT_SECRET
        sync: false
      - key: NIFTY_REDIRECT_URI
        sync: false
      - key: NIFTY_MCP_URL
        sync: false
      - key: NIFTY_MCP_TOKEN
        sync: false
      - key: NIFTY_MCP_PROTOCOL_VERSION
        value: "2025-06-18"
      - key: RAPIDAPI_KEY
        sync: false
      - key: BENZINGA_API_KEY
        sync: false
      - key: GHL_API_KEY
        sync: false
      - key: GHL_LOCATION_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: FRESHDESK_DOMAIN
        sync: false
      - key: FRESHDESK_API_KEY
        sync: false
      - key: FRESHDESK_AGENT_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: REPORT_EMAIL
        sync: false
      - key: CLICKUP_API_TOKEN
        sync: false
      - key: CLICKUP_SOP_SPACE
        sync: false
      - key: CLICKUP_SOP_FOLDER
        sync: false
      - key: CLICKUP_SOP_LIST
        sync: false
      - key: CLICKUP_NOTIFY_CC
        sync: false
      - key: CLICKUP_NOTIFY_BCC
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: HYBRID_JOURNAL_API_KEY
        sync: false
      - key: HYBRID_JOURNAL_MCP_URL
        sync: false
      - key: HYBRID_JOURNAL_MCP_TOKEN
        sync: false
      - key: HYBRID_JOURNAL_MCP_PROTOCOL_VERSION
        value: "2025-06-18"
      - key: APPLE_HEALTH_INGEST_TOKEN
        sync: false
      - key: OURA_ACCESS_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_JUNO_CHAT_ID
        sync: false
      - key: TELEGRAM_SIGNALS_CHAT_ID
        sync: false
      - key: TELEGRAM_KRAKEN_CHAT_ID
        sync: false
      - key: TELEGRAM_COMMUNITY_CHAT_ID
        sync: false
      # Juno Hybrid Autopilot broker adapters. Demo adapters can route orders;
      # live accounts are registry/status-only in this build.
      - key: KRAKEN_FUTURES_DEMO_ENABLED
        value: "false"
      - key: KRAKEN_FUTURES_DEMO_API_KEY
        sync: false
      - key: KRAKEN_FUTURES_DEMO_API_SECRET
        sync: false
      - key: KRAKEN_FUTURES_DEMO_BASE_URL
        value: https://demo-futures.kraken.com/derivatives/api/v3
      - key: KRAKEN_FUTURES_LIVE_API_KEY
        sync: false
      - key: KRAKEN_FUTURES_LIVE_API_SECRET
        sync: false
      - key: KRAKEN_SPOT_API_KEY
        sync: false
      - key: KRAKEN_SPOT_API_SECRET
        sync: false
      - key: TRADOVATE_DEMO_ENABLED
        value: "false"
      - key: TRADOVATE_DEMO_ACCESS_TOKEN
        sync: false
      - key: TRADOVATE_DEMO_ACCOUNT_ID
        sync: false
      - key: TRADOVATE_DEMO_USERNAME
        sync: false
      - key: TRADOVATE_DEMO_BASE_URL
        value: https://demo.tradovateapi.com/v1
      - key: TRADOVATE_LIVE_ACCESS_TOKEN
        sync: false
      - key: TRADOVATE_LIVE_ACCOUNT_ID
        sync: false
      - key: TRADOVATE_LIVE_USERNAME
        sync: false
      - key: DXTRADE_DEMO_ENABLED
        value: "false"
      - key: DXTRADE_DEMO_ORDER_URL
        sync: false
      - key: DXTRADE_DEMO_ACCESS_TOKEN
        sync: false
      - key: DXTRADE_LIVE_ORDER_URL
        sync: false
      - key: DXTRADE_LIVE_ACCESS_TOKEN
        sync: false
      # Contract mapping + quantity examples. Set only when verified for the account.
      - key: JUNO_SYMBOL_MNQ
        sync: false
      - key: JUNO_SIZE_MNQ
        value: "1"
      - key: VILOUD_RTMP_URL
        sync: false
      - key: VILOUD_STREAM_KEY
        sync: false
      - key: GOKOLLAB_RTMP_URL
        sync: false
      - key: GOKOLLAB_STREAM_KEY
        sync: false
      - key: YOUTUBE_STREAM_KEY
        sync: false
      - key: TWITCH_STREAM_KEY
        sync: false
      - key: FACEBOOK_STREAM_KEY
        sync: false
      - key: SCHEDULE_ENABLED
        value: "true"
      - key: SCHEDULE_TIMEZONE
        value: America/New_York
      - key: PROACTIVE_AI_ENABLED
        value: "false"
      - key: PROACTIVE_CHECK_INTERVAL
        value: "30"
      - key: PROACTIVE_AUTO_ACTIONS
        value: "false"

  - type: web
    name: liv8-command-center
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    envVars:
      - key: VITE_API_URL
        value: https://liv8-command-center-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
