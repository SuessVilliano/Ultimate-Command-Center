services:
  - type: web
    name: liv8-command-center-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: liv8-command-center-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.16.0"
      - key: PORT
        value: "3005"
      - key: DB_DATA_DIR
        value: /var/data
      - key: AI_PROVIDER
        value: gemini
      # AI Provider API Keys - can be set in Render dashboard OR through the app's AI Settings page
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_URL
        value: https://command.liv8.co
      - key: FRONTEND_URL
        value: https://command.liv8.co
      # Other Integration Secrets - set in Render dashboard
      - key: TASKADE_API_KEY
        sync: false
      - key: TASKMAGIC_WEBHOOK_URL
        sync: false
      - key: TASKMAGIC_MCP_TOKEN
        sync: false
      # Nifty legacy OAuth fallback
      - key: NIFTY_CLIENT_ID
        sync: false
      - key: NIFTY_CLIENT_SECRET
        sync: false
      - key: NIFTY_REDIRECT_URI
        sync: false
      # Nifty MCP — preferred headless project/team operating layer
      - key: NIFTY_MCP_URL
        sync: false
      - key: NIFTY_MCP_TOKEN
        sync: false
      - key: NIFTY_MCP_PROTOCOL_VERSION
        value: "2025-06-18"
      - key: RAPIDAPI_KEY
        sync: false
      - key: BENZINGA_API_KEY
        sync: false
      - key: GHL_API_KEY
        sync: false
      - key: GHL_LOCATION_ID
        sync: false
      # REQUIRED: Supabase for data persistence (free tier works great)
      # 1. Create account at https://supabase.com
      # 2. Create new project
      # 3. Run the SQL from server/scripts/supabase-schema.sql in SQL Editor
      # 4. Copy URL and anon key from Settings > API
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Freshdesk Integration (for ticket sync)
      - key: FRESHDESK_DOMAIN
        sync: false
      - key: FRESHDESK_API_KEY
        sync: false
      - key: FRESHDESK_AGENT_ID
        sync: false
      # Email/SMTP Configuration (for daily reports)
      # Supports Gmail, Outlook, or any SMTP server
      # Gmail: smtp.gmail.com:587, use App Password
      # Outlook: smtp.office365.com:587
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: REPORT_EMAIL
        sync: false
      # ClickUp SOP Integration
      - key: CLICKUP_API_TOKEN
        sync: false
      - key: CLICKUP_SOP_SPACE
        sync: false
      - key: CLICKUP_SOP_FOLDER
        sync: false
      - key: CLICKUP_SOP_LIST
        sync: false
      - key: CLICKUP_NOTIFY_CC
        sync: false
      - key: CLICKUP_NOTIFY_BCC
        sync: false
      # Slack Integration
      - key: SLACK_WEBHOOK_URL
        sync: false
      # Hybrid Journal REST fallback
      - key: HYBRID_JOURNAL_API_KEY
        sync: false
      # Hybrid Journal MCP — canonical trading intelligence bridge
      - key: HYBRID_JOURNAL_MCP_URL
        sync: false
      - key: HYBRID_JOURNAL_MCP_TOKEN
        sync: false
      - key: HYBRID_JOURNAL_MCP_PROTOCOL_VERSION
        value: "2025-06-18"
      # Telegram Bridge
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_JUNO_CHAT_ID
        sync: false
      - key: TELEGRAM_SIGNALS_CHAT_ID
        sync: false
      - key: TELEGRAM_KRAKEN_CHAT_ID
        sync: false
      - key: TELEGRAM_COMMUNITY_CHAT_ID
        sync: false
      # Live Streaming RTMP Destinations
      - key: VILOUD_RTMP_URL
        sync: false
      - key: VILOUD_STREAM_KEY
        sync: false
      - key: GOKOLLAB_RTMP_URL
        sync: false
      - key: GOKOLLAB_STREAM_KEY
        sync: false
      - key: YOUTUBE_STREAM_KEY
        sync: false
      - key: TWITCH_STREAM_KEY
        sync: false
      - key: FACEBOOK_STREAM_KEY
        sync: false
      # Scheduler Configuration
      - key: SCHEDULE_ENABLED
        value: "true"
      - key: SCHEDULE_TIMEZONE
        value: America/New_York
      # Proactive planning is safe by default: agents prepare work and request
      # approval, but do not execute external actions automatically.
      - key: PROACTIVE_AI_ENABLED
        value: "true"
      - key: PROACTIVE_CHECK_INTERVAL
        value: "30"
      - key: PROACTIVE_AUTO_ACTIONS
        value: "false"

  - type: web
    name: liv8-command-center
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    envVars:
      - key: VITE_API_URL
        value: https://liv8-command-center-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
